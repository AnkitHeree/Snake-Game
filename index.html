<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sname Game</title>

    <link rel = "stylesheet" href="style.css">
</head>
<body>
    
<div class=" game-container">
    <h1>Snake Game</h1>

    <div class="score-box">
        Score : <span id="score">0</span>
    </div>

    <canvas id="gameBoard" width = "400" height="400"></canvas>

    <p id=" message"> Press start to Play Game</p>

    <button id = "startBtn">Start Game</button>

    <div class="controls">

        <button data-dir="up">UP</button>

        <div>
             <button data-dir="left">LEFT</button>
               <button data-dir="down">Down</button>
                 <button data-dir="right">Right</button> 
        </div>

    </div>

    <p class = "hint"> Arrow keys or Buttons ka use kro for move</p>

</div>

<script src="script.js"></script>

</body>
</html>
