
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#101827">
    <title>Snake Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">
        <h1>🐍 Snake Game</h1>

        <div class="score-box">
            Score: <span id="score">0</span>
        </div>

        <div class="board-container">
            <canvas id="gameBoard"
                    width="400"
                    height="400"
                    aria-label="Snake game board"></canvas>
        </div>

        <p id="message" aria-live="polite">
            Press Start to Play!
        </p>

        <button id="startBtn">Start Game</button>

        <div class="controls">
            <button type="button" data-dir="up" aria-label="Up">⬆️</button>

            <div class="horizontal-controls">
                <button type="button" data-dir="left" aria-label="Left">⬅️</button>
                <button type="button" data-dir="down" aria-label="Down">⬇️</button>
                <button type="button" data-dir="right" aria-label="Right">➡️</button>
            </div>
        </div>

        <p class="hint">
            Use arrow keys, touch buttons or swipe to move
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
